<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title description">
  <title id="title">Expense processing in Azure</title>
  <desc id="description">A mobile React app submits a receipt through the receipt API to private Azure Blob Storage. An asynchronous worker uses Azure Document Intelligence to extract line items. Policy checks evidence, price and the PostgreSQL allowance. A clean confirmed claim is reserved and queued for IFS posting. Other claims go to human review. The adapter records acknowledgment and reconciles uncertain results.</desc>
